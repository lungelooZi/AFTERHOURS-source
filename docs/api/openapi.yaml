openapi: 3.1.0
info:
  title: AFTERHOURS API
  version: 0.5.0
  description: |
    Identity, sessions and roles for the AFTERHOURS platform.
    Browsers authenticate with the `ah_session` httpOnly cookie; other clients may send
    `Authorization: Bearer <token>`. All request bodies are JSON.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:4000
security:
  - cookieAuth: []
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Liveness
      security: []
      responses:
        '200': { description: Process is up, content: { application/json: { schema: { type: object, properties: { status: { const: ok }, version: { type: string } } } } } }
  /ready:
    get:
      summary: Readiness (database reachable)
      security: []
      responses:
        '200': { description: Ready }
        '503': { description: A dependency is unavailable }
  /auth/register:
    post:
      summary: Create a player account and start a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, displayName]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 12, maxLength: 128 }
                displayName: { type: string, minLength: 2, maxLength: 40 }
      responses:
        '201': { $ref: '#/components/responses/SessionIssued' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      summary: Sign in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200': { $ref: '#/components/responses/SessionIssued' }
        '401': { $ref: '#/components/responses/Error' }
        '429':
          description: Too many failed attempts
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds to wait }
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /auth/password-reset:
    post:
      summary: Request a password reset email
      description: Always answers 202 with the same body, whether or not the email has an account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string } } }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { type: object, properties: { message: { type: string } } } } } }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/password-reset/confirm:
    post:
      summary: Set a new password using a reset token
      description: Single use. Signs the user out on every device and clears the session cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 12, maxLength: 128 }
      responses:
        '204': { description: Password changed }
        '400': { description: "validation_failed or invalid_reset_token", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/logout:
    post:
      summary: Revoke the current session
      responses:
        '204': { description: Signed out }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout-all:
    post:
      summary: Revoke every session for the current user
      responses:
        '204': { description: Signed out everywhere }
        '401': { $ref: '#/components/responses/Error' }
  /auth/me:
    get:
      summary: The current user
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { user: { $ref: '#/components/schemas/User' } } } } } }
        '401': { $ref: '#/components/responses/Error' }
  /auth/sessions:
    get:
      summary: The current user's signed-in devices, most recently used first
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions: { type: array, items: { $ref: '#/components/schemas/DeviceSession' } }
        '401': { $ref: '#/components/responses/Error' }
  /auth/sessions/{id}:
    delete:
      summary: Sign out one of your own devices
      description: Another user's session id, or an unknown id, returns 404. Clears the cookie if it is the current device.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Signed out }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /cases/{caseId}:
    get:
      summary: The caller's view of a case (creates a guest run and the ah_guest cookie on first visit)
      security: []
      parameters: [{ $ref: '#/components/parameters/CaseId' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { view: { $ref: '#/components/schemas/PlayerView' } } } } } }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /cases/{caseId}/actions:
    post:
      summary: Make a move
      description: A refused move (e.g. wrong password) is still 200, with outcome.accepted = false.
      security: []
      parameters: [{ $ref: '#/components/parameters/CaseId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { type: object, required: [type, app], properties: { type: { const: open }, app: { enum: [messages, files, archive] } } }
                - { type: object, required: [type, password], properties: { type: { const: unlock }, password: { type: string } } }
                - { type: object, required: [type, evidenceId], properties: { type: { enum: [pin, unpin] }, evidenceId: { type: string } } }
                - { type: object, required: [type, deductionId, answer, supporting], properties: { type: { const: deduce }, deductionId: { type: string }, answer: { type: string }, supporting: { type: array, items: { type: string } } } }
                - { type: object, required: [type], properties: { type: { const: hint } } }
                - { type: object, required: [type, text], properties: { type: { const: notes }, text: { type: string } } }
                - { type: object, required: [type, channel], properties: { type: { const: decide }, channel: { type: string } } }
      responses:
        '200':
          description: The new view and whether the move was accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  view: { $ref: '#/components/schemas/PlayerView' }
                  outcome:
                    type: object
                    properties:
                      accepted: { type: boolean }
                      reason: { enum: [wrong_password, not_established, not_found_yet, not_ready, case_closed, no_more_hints, unknown] }
        '400': { $ref: '#/components/responses/Error' }
        '409': { description: Changed in another window too many times; retry, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: Too many wrong archive passwords, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /cases/{caseId}/restart:
    post:
      summary: Start the case again
      security: []
      parameters: [{ $ref: '#/components/parameters/CaseId' }]
      responses:
        '200': { description: The fresh view }
  /admin/users/{id}/role:
    patch:
      summary: Change a user's role (admin only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [role], properties: { role: { $ref: '#/components/schemas/Role' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { type: object, properties: { user: { $ref: '#/components/schemas/User' } } } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /admin/audit:
    get:
      summary: Recent audit log entries (admin only)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
components:
  parameters:
    CaseId: { name: caseId, in: path, required: true, schema: { type: string, examples: [case-001] } }
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: ah_session }
    bearerAuth: { type: http, scheme: bearer }
  schemas:
    Role: { type: string, enum: [player, creator, admin] }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        createdAt: { type: string, format: date-time }
    PlayerView:
      type: object
      description: Only what the player has earned. Unsolved deductions have options but no answer; evidence appears once found.
      properties:
        caseId: { type: string }
        title: { type: string }
        progress: { type: object }
        apps: { type: object, description: Found evidence per desktop app }
        archive: { type: object, properties: { unlocked: { type: boolean } } }
        pinned: { type: array, items: { type: object } }
        deductions: { type: array, items: { type: object } }
        timeline: { type: array, items: { type: object } }
        hints: { type: object, properties: { revealed: { type: array, items: { type: string } }, remaining: { type: integer } } }
        notes: { type: string }
        resolve: { type: object }
        ending: { type: [object, 'null'] }
    DeviceSession:
      type: object
      properties:
        id: { type: string, format: uuid }
        userAgent: { type: [string, 'null'] }
        ip: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, description: Updated at most every 5 minutes }
        expiresAt: { type: string, format: date-time }
        current: { type: boolean }
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [validation_failed, conflict, unauthenticated, invalid_credentials, invalid_reset_token, forbidden, not_found, email_taken, rate_limited] }
            message: { type: string }
            details: {}
  responses:
    SessionIssued:
      description: Session created; also sets the `ah_session` cookie
      content:
        application/json:
          schema:
            type: object
            properties:
              user: { $ref: '#/components/schemas/User' }
              expiresAt: { type: string, format: date-time }
    Error:
      description: Error
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
