# Local infrastructure. The apps run on your machine with Node; only Postgres runs here.
# Start:  docker compose up -d db
# Stop:   docker compose down        (add -v to wipe data)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: afterhours
      POSTGRES_PASSWORD: afterhours
      POSTGRES_DB: afterhours
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afterhours"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
